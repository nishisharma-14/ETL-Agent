version: '3.8'

services:
  # 1. PostgreSQL Relational Database Service
  db:
    image: postgres:15-alpine
    container_name: etl_postgres
    restart: always
    environment:
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: etl_password
      POSTGRES_DB: etl_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_user -d etl_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Web API & ETL Service
  api:
    build: .
    container_name: etl_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://etl_user:etl_password@db:5432/etl_db
      - API_URL=https://dummyjson.com/products
      - API_PAGE_LIMIT=30
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m src.pipeline && uvicorn src.api:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
